name: 编译 Windows 桌面客户端

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_VERSION: "1.75"
  FLUTTER_VERSION: "3.24.5"
  LLVM_VERSION: "15.0.6"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  windows-client:
    name: Windows desktop client (x64)
    needs: generate-bridge
    runs-on: windows-2022
    steps:
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Restore Flutter bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: bridge-artifact
          path: .

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install Flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - name: Configure vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}

      - name: Install native dependencies
        shell: bash
        run: |
          "$VCPKG_ROOT/vcpkg" install --triplet x64-windows-static \
            --x-install-root="$VCPKG_ROOT/installed"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: windows-flutter-x64

      - name: Use RustDesk's Windows Flutter engine
        shell: pwsh
        run: |
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile engine.zip
          Expand-Archive -Path engine.zip -DestinationPath windows-x64-release
          Move-Item -Force windows-x64-release\* "C:\hostedtoolcache\windows\flutter\stable-${{ env.FLUTTER_VERSION }}-x64\bin\cache\artifacts\engine\windows-x64-release\"

      - name: Apply Flutter compatibility patch
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff "$(dirname "$(dirname "$(which flutter)")")"
          cd "$(dirname "$(dirname "$(which flutter)")")"
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Build portable Windows client
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python .\build.py --portable --flutter --skip-portable-pack
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item .\flutter\build\windows\x64\runner\Release .\rustdesk
          Push-Location .\libs\portable
          pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .\generate.py -f ..\..\rustdesk -o . -e ..\..\rustdesk\rustdesk.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          New-Item -ItemType Directory -Force .\dist | Out-Null
          Move-Item .\target\release\rustdesk-portable-packer.exe .\dist\RustDesk-portable-x64.exe

      - name: Upload Windows client
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rustdesk-windows-x64
          if-no-files-found: error
          path: |
            dist/RustDesk-portable-x64.exe
            rustdesk
